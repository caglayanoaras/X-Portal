{% extends "base.html" %}
{% set navbar_page_title = "Actions" %}
{% block title %}Actions{% endblock %}

{% block content %}
<!-- Endpoint URLs for the JS module (Jinja can't template inside type=module scripts) -->
<div id="actions-urls"
     data-url-types="{{ url_for('get_active_action_types') }}"
     data-url-mine="{{ url_for('get_my_actions') }}"
     data-url-create="{{ url_for('create_action') }}"
     data-url-update="{{ url_for('update_action', action_id='PLACEHOLDER') }}"
     data-url-start="{{ url_for('start_action', action_id='PLACEHOLDER') }}"
     data-url-finish="{{ url_for('finish_action', action_id='PLACEHOLDER') }}"
     data-url-cancel="{{ url_for('cancel_action', action_id='PLACEHOLDER') }}">
</div>

<div class="p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0"><i class="fas fa-bolt text-primary me-2"></i>My Actions</h3>
    <div>
      {% if is_action_admin %}
      <a href="{{ url_for('actions_admin_page') }}" class="btn btn-outline-secondary me-2">
        <i class="fas fa-gear me-1"></i>Admin
      </a>
      {% endif %}
      <button class="btn btn-primary" id="add-action-btn"><i class="fas fa-plus me-1"></i>New Action</button>
    </div>
  </div>

  <div id="my-actions-grid" style="height: 600px;"></div>
</div>

<!-- Add / Edit Action modal (dynamic form) -->
<div class="modal fade" id="action-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="action-modal-title">New Action</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="action-form-error" class="alert alert-danger py-2 d-none" role="alert"></div>
        <form id="action-form" autocomplete="off">
          <div class="mb-3" id="action-type-select-wrap">
            <label for="action-type-select" class="form-label">Action Type</label>
            <select id="action-type-select" class="form-select"></select>
          </div>
          <div id="action-form-fields"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="action-save-btn"><i class="fas fa-save me-1"></i>Save</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/ag-grid-enterprise.min.js') }}"></script>
<script type="module" src="{{ url_for('static', path='js/apps/actions-app.js') }}"></script>
{% endblock %}
